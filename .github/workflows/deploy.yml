name: Deploy to GCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to GCP Server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST || secrets.SERVER_IP || vars.SERVER_HOST || vars.SERVER_IP }}
          username: ${{ secrets.SERVER_USER || secrets.SERVER_USERNAME || vars.SERVER_USER || vars.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 120m
          envs: GITHUB_TOKEN
          script: |
            # Navigate to the project directory
            cd ${{ secrets.SERVER_PATH || secrets.PROJECT_PATH || vars.SERVER_PATH || vars.PROJECT_PATH }}
            
            # Set the remote URL to authenticate with GitHub using the automatically provided Action token
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
            
            # Fetch latest commit so the server immediately has the new deploy scripts
            git fetch origin main
            git reset --hard origin/main
            
            # Make sure deploy scripts are executable
            chmod +x deploy.sh clean-rebuild.sh
            
            # Run the deployment script
            ./deploy.sh

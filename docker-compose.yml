version: '3.8'

services:

  # ==========================================
  # 1. API GATEWAY (Kong DB-less)
  # ==========================================
  kong:
    image: kong:3.5
    container_name: kong-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_CLIENT_MAX_BODY_SIZE: "50m"
      KONG_DNS_RESOLVER: "127.0.0.11"
      KONG_DNS_ORDER: "LAST,A,CNAME"
      KONG_DNS_STALE_TTL: "4"
      KONG_DNS_NOT_FOUND_TTL: "2"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      FORCE_RECREATE: "1"
    ports:
      - "8000:8000"
      - "8002:8001" # Admin API exposed on 8002 to avoid conflict with saas-admin on 8001
    volumes:
      - ./kong:/kong/declarative
    restart: always
    networks:
      - saas_network

  # ==========================================
  # 2. FRONTEND (Public App)
  # ==========================================
  saas-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://kong:8000
    container_name: saas-frontend
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://kong:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kong
    restart: always
    networks:
      - saas_network

  # ==========================================
  # 3. ADMIN PORTAL (Private App)
  # ==========================================
  saas-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://kong:8000
    container_name: saas-admin
    ports:
      - "8001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://kong:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kong
    restart: always
    networks:
      - saas_network

  # ==========================================
  # 4. BACKEND MICROSERVICES (Internal)
  # ==========================================
  saas-backend-sso:
    build:
      context: ./backend/apps/sso
      dockerfile: Dockerfile
    container_name: saas-backend-sso
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=saas-postgres
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-adminpassword}
      - DB_NAME=${POSTGRES_DB:-saas_db}
      - REDIS_HOST=${REDIS_HOST:-saas-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_URL=${REDIS_URL:-redis://saas-redis:6379}
      - SSO_SYNCHRONIZE=false
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Vero Platform}
      - OTP_TTL_SECONDS=${OTP_TTL_SECONDS:-600}
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL:-superadmin@systemdb.com}
      - SUPERADMIN_DEFAULT_OTP=${SUPERADMIN_DEFAULT_OTP:-123456}
      - TEST_OTP_CODES=${TEST_OTP_CODES:-123456,234567,345678,456789}
      - NOTIFICATION_SERVICE_URL=http://saas-backend-notification:3014/notification-service/internal/notifications
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - TWILIO_MESSAGING_SERVICE_SID=${TWILIO_MESSAGING_SERVICE_SID:-}
    env_file:
      - ./backend/config/sso-keys.conf
    depends_on:
      - saas-postgres
      - saas-redis
    restart: always
    networks:
      - saas_network

  saas-backend-admin:
    build:
      context: ./backend/apps/admin
      dockerfile: Dockerfile
    container_name: saas-backend-admin
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DB_HOST=saas-postgres
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-adminpassword}
      - DB_NAME=${POSTGRES_DB:-saas_db}
    env_file:
      - ./backend/config/sso-keys.conf
    depends_on:
      - saas-postgres
      - saas-backend-sso
    restart: always
    networks:
      - saas_network

  saas-backend-platform:
    build:
      context: ./backend/apps/platform
      dockerfile: Dockerfile
    container_name: saas-backend-platform
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DB_HOST=saas-postgres
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-adminpassword}
      - DB_NAME=${POSTGRES_DB:-saas_db}
    env_file:
      - ./backend/config/sso-keys.conf
    depends_on:
      - saas-postgres
      - saas-backend-sso
    restart: always
    networks:
      - saas_network

  saas-backend-technology:
    build:
      context: ./backend/apps/technology
      dockerfile: Dockerfile
    container_name: saas-backend-technology
    environment:
      - NODE_ENV=production
      - PORT=3010
      - DB_HOST=saas-postgres
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-adminpassword}
      - DB_NAME=${POSTGRES_DB:-saas_db}
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:adminpassword@saas_mongodb:27017/saas_db?authSource=admin}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-saas_db}
    env_file:
      - ./backend/config/sso-keys.conf
    depends_on:
      - saas-postgres
      - saas_mongodb
      - saas-backend-sso
    restart: always
    networks:
      - saas_network

  saas-backend-user-profile:
    build:
      context: ./backend/apps/user-profile
      dockerfile: Dockerfile
    container_name: saas-backend-user-profile
    env_file:
      - ./backend/config/sso-keys.conf
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DB_HOST=saas-postgres
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-adminpassword}
      - DB_NAME=${POSTGRES_DB:-saas_db}
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:adminpassword@saas_mongodb:27017/saas_db?authSource=admin}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-saas_db}
      - SSO_URL=http://saas-backend-sso:3001
      - SSO_ISSUER=http://saas-backend-sso:3001/sso
    depends_on:
      - saas-postgres
      - saas_mongodb
      - saas-backend-sso
    restart: always
    networks:
      - saas_network

  saas-backend-notification:
    build:
      context: ./backend/apps/notification
      dockerfile: Dockerfile
    container_name: saas-backend-notification
    environment:
      - NODE_ENV=production
      - PORT=3014
      - DB_HOST=saas-postgres
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-adminpassword}
      - DB_NAME=${POSTGRES_DB:-saas_db}
      - REDIS_HOST=${REDIS_HOST:-saas-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    env_file:
      - ./backend/config/sso-keys.conf
    depends_on:
      - saas-postgres
      - saas-redis
      - saas-backend-sso
    restart: always
    networks:
      - saas_network

  saas-backend-payment:
    build:
      context: ./backend/apps/payment
      dockerfile: Dockerfile
    container_name: saas-backend-payment
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DB_HOST=saas-postgres
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-adminpassword}
      - DB_NAME=${POSTGRES_DB:-saas_db}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-}
      - WALLET_DEFAULT_CURRENCY=${WALLET_DEFAULT_CURRENCY:-USD}
    env_file:
      - ./backend/config/sso-keys.conf
    depends_on:
      - saas-postgres
      - saas-backend-sso
    restart: always
    networks:
      - saas_network

  saas-backend-investment:
    build:
      context: ./backend/apps/investment
      dockerfile: Dockerfile
    container_name: saas-backend-investment
    environment:
      - NODE_ENV=production
      - PORT=3012
      - DB_HOST=saas-postgres
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-adminpassword}
      - DB_NAME=${POSTGRES_DB:-saas_db}
      - WALLET_SERVICE_URL=http://saas-backend-wallet:3015/wallet-service
      - NOTIFICATION_SERVICE_URL=http://saas-backend-notification:3014/notification-service
    env_file:
      - ./backend/config/sso-keys.conf
    depends_on:
      - saas-postgres
      - saas-backend-sso
    restart: always
    networks:
      - saas_network

  # ==========================================
  # 5. DATABASE & INFRASTRUCTURE
  # ==========================================
  saas-postgres:
    image: postgres:15-alpine
    container_name: saas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: ${POSTGRES_DB:-saas_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - saas_network

  saas_mongodb:
    image: mongo:7
    container_name: saas_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}
    volumes:
      - mongodb_data:/data/db
    restart: always
    networks:
      - saas_network

  saas-redis:
    image: redis:7-alpine
    container_name: saas-redis
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - saas_network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  saas_network:
    driver: bridge

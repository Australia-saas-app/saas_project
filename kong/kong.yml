_format_version: "3.0"
_transform: true

services:
  - name: sso-service
    url: http://saas-backend-sso:3001/sso
    routes:
      - name: sso-route
        paths:
          - /api/v1/sso
        strip_path: true

  - name: admin-service
    url: http://saas-backend-admin:3002
    routes:
      - name: admin-route
        paths:
          - /api/v1/admin
        strip_path: true

  - name: platform-service
    url: http://saas-backend-platform:3006/platform-service
    routes:
      - name: platform-route
        paths:
          - /api/v1/platform-service
          - /api/v1/platform
        strip_path: true

  - name: file-storage-service
    url: http://saas-backend-file-storage:3007
    routes:
      - name: file-storage-route
        paths:
          - /api/v1/file-storage
        strip_path: true

  - name: chat-service
    url: http://saas-backend-chat:3008
    routes:
      - name: chat-route
        paths:
          - /api/v1/chat
        strip_path: true

  - name: technology-service
    url: http://saas-backend-technology:3010
    routes:
      - name: technology-route
        paths:
          - /api/v1/technology
        strip_path: true

  - name: user-service
    url: http://saas-backend-user:3013
    routes:
      - name: user-route
        paths:
          - /api/v1/users
        strip_path: true

  - name: user-profile-service
    url: http://saas-backend-user-profile:3005/user-profile-service
    routes:
      - name: user-profile-route
        paths:
          - /api/v1/user-profile-service
        strip_path: true

  - name: wallet-service
    url: http://saas-backend-sso:3001/sso/wallet
    routes:
      - name: wallet-route
        paths:
          - /api/v1/wallet
        strip_path: true

  - name: payment-service
    url: http://saas-backend-payment:3004/api/payment
    routes:
      - name: payment-route
        paths:
          - /api/v1/payment
          - /api/payment
          - /payment
        strip_path: true

  - name: notification-service
    url: http://saas-backend-notification:3014/notification-service/notifications
    routes:
      - name: notification-route
        paths:
          - /api/v1/notifications
        strip_path: true

  - name: notification-ws-service
    url: http://saas-backend-notification:3014
    routes:
      - name: notification-ws-route
        paths:
          - /notifications
          - /socket.io
        strip_path: false

  - name: investment-service
    url: http://saas-backend-investment:3012
    routes:
      - name: investment-route
        paths:
          - /api/v1/investment
          - /api/investment
          - /investment
        strip_path: true

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Auth-Token
        - cookie
        - x-requested-with
        - cache-control
        - pragma
        - expires
      exposed_headers:
        - Authorization
        - Set-Cookie
      credentials: true
      max_age: 3600
      preflight_continue: false